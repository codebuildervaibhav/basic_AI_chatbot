<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemma Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="api-key-warning" id="ollamaWarning">
            ⚠️ Please make sure Ollama is running with 'ollama serve'
        </div>
        
        <div class="chat-header">
            <h1>🤖 Gemma Chatbot</h1>
            <div class="subtitle">Powered by Google Gemma via Ollama</div>
            <button class="clear-btn" onclick="clearHistory()">Clear History</button>
            <button class="health-btn" onclick="checkOllama()">Check Ollama</button>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                Hello! I'm your Gemma-powered assistant. How can I help you today?
            </div>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form class="chat-input-form" onsubmit="sendMessage(event)">
                <input 
                    type="text" 
                    class="chat-input" 
                    id="messageInput" 
                    placeholder="Type your message..." 
                    autocomplete="off"
                    required
                >
                <button type="submit" class="send-btn" id="sendBtn">Send</button>
            </form>
        </div>
    </div>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>

</body>
</html>
